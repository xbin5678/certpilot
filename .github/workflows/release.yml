name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build linux binaries
        run: |
          set -e
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
              go build -trimpath -ldflags "-s -w" -o certpilot .
            tar czf "certpilot-linux-$arch.tar.gz" certpilot
            rm -f certpilot
          done
          ls -lh certpilot-linux-*.tar.gz

      - name: Bake repo into install.sh
        if: startsWith(github.ref, 'refs/tags/')
        run: sed -i "s|__REPO__|${GITHUB_REPOSITORY}|g" install.sh && grep -n "REPO=" install.sh | head -1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            certpilot-linux-amd64.tar.gz
            certpilot-linux-arm64.tar.gz
            install.sh
            uninstall.sh
          generate_release_notes: true
